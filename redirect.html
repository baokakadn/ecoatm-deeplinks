<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening ecoATM…</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Social OG tags — shown when link is shared -->
  <meta property="og:title"       content="ecoATM — Sell Your Phone for Instant Cash">
  <meta property="og:description" content="Get an instant cash offer at your nearest ecoATM kiosk.">
  <meta property="og:image"       content="https://links.ecoatm.com/assets/og-default.jpg">
  <meta property="og:url"         content="https://links.ecoatm.com/redirect">
  <meta property="og:type"        content="website">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; }
    @keyframes eco-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading modal -->
  <div id="loading-modal" role="dialog" aria-modal="true" aria-label="Opening ecoATM" style="
    position:fixed; inset:0;
    background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:9999;
  ">
    <div style="
      background:#fff;
      border-radius:16px;
      padding:40px 48px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:20px;
      min-width:260px;
      text-align:center;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    ">
      <img
        src="https://www.ecoatm.com/cdn/shop/files/ecoATM_logo_sea_RGB.png?v=1723069663&width=200"
        alt="ecoATM"
        style="height:20px;width:auto;">

      <div style="
        width:40px; height:40px;
        border:3px solid #E1F5EE;
        border-top-color:#00A651;
        border-radius:50%;
        animation:eco-spin .8s linear infinite;
      "></div>

      <p style="margin:0;font-size:15px;color:#5c5c5c;line-height:1.5;">
        Opening the ecoATM app&hellip;
      </p>
    </div>
  </div>

  <script src="/js/deeplink.js"></script>

</body>
</html>
